name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt `
            -Pattern 'project\(CryptoPricePlugin VERSION (\d+\.\d+\.\d+)'
          if (-not $match) {
            throw 'Cannot read the project version from CMakeLists.txt.'
          }

          $cmakeVersion = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag must use vX.Y.Z format, got: $env:GITHUB_REF_NAME"
            }

            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $cmakeVersion) {
              throw "Tag version $tagVersion does not match CMake version $cmakeVersion."
            }
            $artifactVersion = $tagVersion
          }
          else {
            $artifactVersion = $cmakeVersion
          }

          "artifact_version=$artifactVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Artifact version: $artifactVersion"

  build:
    name: Build ${{ matrix.label }}
    needs: metadata
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            label: x64
          - architecture: Win32
            label: win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare DLL
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build/Release/CryptoPrice.dll'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Build output not found: $source"
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $PWD 'dist/CryptoPrice.dll')

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPrice-${{ matrix.label }}
          path: dist/CryptoPrice.dll
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DLL artifacts by architecture
        uses: actions/download-artifact@v4
        with:
          pattern: CryptoPrice-*
          path: release-artifacts
          merge-multiple: false

      - name: Package DLLs and create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for architecture in x64 win32; do
            (cd "release-artifacts/CryptoPrice-$architecture" && \
              zip "$GITHUB_WORKSPACE/release-assets/CryptoPrice-$architecture.zip" CryptoPrice.dll)
          done
          cd release-assets
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ needs.metadata.outputs.artifact_version }}'
          $lines = @(Get-Content -LiteralPath CHANGELOG.md)
          $escapedVersion = [regex]::Escape($version)
          $versionHeading = "^##\s+\[?v?$escapedVersion\]?(?:\s+-.*)?\s*$"

          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match $versionHeading) {
              $start = $index + 1
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain a section for version $version."
          }

          $end = $lines.Count
          for ($index = $start; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^##\s+') {
              $end = $index
              break
            }
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          for ($index = $start; $index -lt $end; $index++) {
            $notes.Add($lines[$index])
          }
          while ($notes.Count -gt 0 -and [string]::IsNullOrWhiteSpace($notes[0])) {
            $notes.RemoveAt(0)
          }
          while ($notes.Count -gt 0 -and [string]::IsNullOrWhiteSpace($notes[$notes.Count - 1])) {
            $notes.RemoveAt($notes.Count - 1)
          }
          if ($notes.Count -eq 0) {
            throw "The CHANGELOG.md section for version $version is empty."
          }

          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          Write-Host "Release notes for $version:"
          $notes | ForEach-Object { Write-Host "  $_" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: CryptoPrice ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
